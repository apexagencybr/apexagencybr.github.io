<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apex Connect</title>

<link rel="apple-touch-icon" href="apple-touch-icon_clean.png">
<link rel="manifest" href="manifest.json">

<style>
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#050505;
color:white;
}

header{
display:flex;
align-items:center;
justify-content:space-between;
padding:16px;
background:#111;
}

#menuBtn{
font-size:22px;
cursor:pointer;
}

#drawer{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#111;
transition:0.3s;
padding:20px;
}

#drawer.open{
left:0;
}

.card{
background:#171717;
padding:16px;
margin:12px;
border-radius:12px;
}

footer{
text-align:center;
padding:20px;
color:#aaa;
font-size:14px;
}

input{
padding:10px;
width:180px;
}

button{
padding:10px 16px;
margin-left:10px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<div id="menuBtn">☰</div>
<h2>Apex Connect</h2>
</header>

<div id="drawer">
<h3>Menu</h3>
<p>Dados</p>
<p>Desenvolvimento</p>
<p>Apex Shop disponível em breve</p>
</div>

<div style="padding:20px">

<div class="card">
<h3>Acesso ao site</h3>
<p>Digite os 6 últimos dígitos do seu ID:</p>
<input id="userID" placeholder="000000">
<button onclick="login()">Entrar</button>
</div>

<div id="dadosArea"></div>

</div>

<footer>
Apex Connect Beta v0.02 - Todos direitos reservados à Assessoria Apex Agency LTDA.
</footer>

<script>

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBN9qWKYpXhC1ZfuH1qiQTY0D9pty3vhKeqeLjMYA/exec";

document.getElementById("menuBtn").onclick = () => {
document.getElementById("drawer").classList.toggle("open");
}

async function login(){
const id = document.getElementById("userID").value;

const res = await fetch(APPS_SCRIPT_URL);
const data = await res.json();

const user = data.criadores.find(c => c.id == id);

if(!user){
alert("ID não encontrado");
return;
}

mostrarDados(user);
}

function mostrarDados(user){

document.getElementById("dadosArea").innerHTML = `

<div class="card">
<h3>Diamantes</h3>
<p>${user.diamantes}</p>
</div>

<div class="card">
<h3>Duração da LIVE</h3>
<p>${user.horas}</p>
</div>

<div class="card">
<h3>Dias válidos</h3>
<p>${user.dias}</p>
</div>

<div class="card">
<h3>Lives feitas</h3>
<p>${user.lives}</p>
</div>

`;

}

</script>

</body>
</html>
